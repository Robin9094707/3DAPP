name: Build RJ Spatial IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: iPhone IPA · Release
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          python3 Scripts/make_icon.py
          xcodegen generate
          xcodebuild -version
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -project RJSpatial.xcodeproj -scheme RJSpatial \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log
      - name: Package unsigned IPA
        run: |
          test -d build/Build/Products/Release-iphoneos/RJSpatial.app
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/RJSpatial.app dist/Payload/
          cd dist
          zip -qry RJ-Spatial-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RJ-Spatial-unsigned-IPA
          path: dist/RJ-Spatial-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
