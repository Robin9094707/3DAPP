name: RJSpatial
options:
  bundleIdPrefix: eu.rjuhas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  RJSpatial:
    type: application
    platform: iOS
    sources:
      - path: Spatial
    info:
      path: Spatial/Info.plist
      properties:
        CFBundleDisplayName: RJ Spatial
        NSCameraUsageDescription: Die Kamera und LiDAR erfassen Räume, Oberflächen und deine AR-Messpunkte. Scans bleiben auf diesem Gerät, bis du sie teilst.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.rjuhas.spatial
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: RoomPlan.framework
      - sdk: ARKit.framework
      - sdk: SceneKit.framework
      - sdk: RealityKit.framework
schemes:
  RJSpatial:
    build:
      targets:
        RJSpatial: all
    run:
      config: Debug
    archive:
      config: Release
